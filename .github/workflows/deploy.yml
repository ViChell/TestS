name: Deploy to patchlab.lga2011.com.ua

on:
  push:
    branches: [main, claude/busy-johnson-cuni9f]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # No --delete: files that exist only on the server (configs with DB passwords,
      # user uploads, data/) are never removed or overwritten by a deploy
      - name: Upload files
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude '.git/' --exclude '.github/' --exclude 'data/' --exclude 'node_modules/' \
            --exclude-from .deployignore \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Restart app
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}
        if: ${{ env.RESTART_CMD != '' }}
        run: ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "$RESTART_CMD"
